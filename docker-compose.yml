version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ecogrid-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in the root .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  intelligence:
    build:
      context: .
      dockerfile: intelligence/Dockerfile
    container_name: ecogrid-intelligence
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - IMPORT_SERVICE_TOKEN=${IMPORT_SERVICE_TOKEN:?Set IMPORT_SERVICE_TOKEN in the environment}
      - IMPORT_STORAGE_DIR=/app/imports
      - MODEL_ARTIFACT_DIR=/app/model-artifacts
    volumes:
      - importdata:/app/imports
      - modeldata:/app/model-artifacts

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecogrid-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in the root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in the root .env}?schema=public
      - PYTHON_SERVICE_URL=http://intelligence:8000
      - IMPORT_SERVICE_TOKEN=${IMPORT_SERVICE_TOKEN:?Set IMPORT_SERVICE_TOKEN in the environment}
      - IMPORT_STORAGE_DIR=/app/imports
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment}
    depends_on:
      db:
        condition: service_healthy
      intelligence:
        condition: service_started
    volumes:
      - importdata:/app/imports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecogrid-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  importdata:
  modeldata:
